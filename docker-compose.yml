services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
      SENTINEL_DECISIONS_MOCK: ${SENTINEL_DECISIONS_MOCK:-1}
      SENTINEL_RECORD: ${SENTINEL_RECORD:-}
      SENTINEL_PUBLIC_API: ${SENTINEL_PUBLIC_API:-}
      SENTINEL_AGENT_MOCK: ${SENTINEL_AGENT_MOCK:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEVIN_API_KEY: ${DEVIN_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: uvicorn server.app:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
