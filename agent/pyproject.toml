[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel_agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx", "fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["sentinel_agent"]

[tool.pytest.ini_options]
pythonpath = [".."]
