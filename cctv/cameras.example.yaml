# camera id (as in config/site.yaml `cameras[].id`) -> stream URI.
# Copy to cameras.local.yaml (gitignored) for real cameras. Put credentials in env
# and reference them as ${VAR}; they are URL-encoded and never logged.
cameras:
  - id: camera-1
    uri: rtsp://localhost:8554/camera-1          # cctv/mock_cctv.sh (looped stock footage)
